---
.test_starpu_template:
  extends: .test_script_template
  needs: [build_starpu_cuda_mpi]
  dependencies:
    - build_starpu_cuda_mpi
  artifacts:
    name: test_starpu
    expire_in: 48 hours
    paths:
      - build
      - ./*.log
      - ./*.lcov
    reports:
      junit: report.xml

.test_starpu_template_master: &test_starpu_master
  extends:
    - .test_starpu_template
    - .only-master

.test_starpu_template_branches: &test_starpu_branches
  extends:
    - .test_starpu_template
    - .only-branches

test_starpu_shm_s:
  <<: *test_starpu_master
  variables:
    STARPU_WORKERS_NOBIND: 1
    STARPU_SILENT: 1
    VERSION: starpu
    CATEGORY: shm
    PRECISION: s
    TESTS_RESTRICTION: "-R \"_${CATEGORY}_${PRECISION}\""
    CHAMELEON_RUNTIME_LIBRARY: $CI_PROJECT_DIR/build/runtime/starpu/libchameleon_starpu.so

